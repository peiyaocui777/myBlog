<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <text x="380" y="32" text-anchor="middle" font-size="15" fill="#1A1A1E" font-weight="bold">四类输入，三条路径，一个元素模型</text>
  <!-- 输入列 -->
  <text x="80" y="66" text-anchor="middle" font-size="12" fill="#9B9BA4">输入</text>
  <rect x="20" y="80" width="120" height="40" rx="4" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="80" y="105" text-anchor="middle" font-size="13" fill="#1A1A1E">.docx</text>
  <rect x="20" y="140" width="120" height="40" rx="4" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="80" y="165" text-anchor="middle" font-size="13" fill="#1A1A1E">.doc 老格式</text>
  <rect x="20" y="200" width="120" height="40" rx="4" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="80" y="225" text-anchor="middle" font-size="13" fill="#1A1A1E">数字 PDF</text>
  <rect x="20" y="260" width="120" height="40" rx="4" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="80" y="285" text-anchor="middle" font-size="13" fill="#1A1A1E">扫描件/拍照</text>
  <!-- 路径列 -->
  <text x="350" y="66" text-anchor="middle" font-size="12" fill="#9B9BA4">路径</text>
  <rect x="240" y="70" width="230" height="86" rx="6" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="355" y="96" text-anchor="middle" font-size="13.5" fill="#1A1A1E" font-weight="bold">A' 本地解析</text>
  <text x="355" y="118" text-anchor="middle" font-size="11.5" fill="#6E6E78">python-docx + lxml：结构/公式/样式</text>
  <text x="355" y="138" text-anchor="middle" font-size="11.5" fill="#6E6E78">OnlyOffice 转 PDF + PyMuPDF 对齐落 bbox</text>
  <rect x="240" y="196" width="230" height="52" rx="6" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="355" y="218" text-anchor="middle" font-size="13.5" fill="#1A1A1E" font-weight="bold">数字 PDF 混合</text>
  <text x="355" y="238" text-anchor="middle" font-size="11.5" fill="#6E6E78">PyMuPDF 文本层直提 + Paddle 只做版面</text>
  <rect x="240" y="262" width="230" height="52" rx="6" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="355" y="284" text-anchor="middle" font-size="13.5" fill="#1A1A1E" font-weight="bold">Route B · OCR</text>
  <text x="355" y="304" text-anchor="middle" font-size="11.5" fill="#6E6E78">PaddleOCR-VL：只有无文本层的输入才全靠它</text>
  <!-- 输出 -->
  <rect x="560" y="120" width="180" height="140" rx="6" fill="none" stroke="#B4532A" stroke-width="1.5"/>
  <text x="650" y="150" text-anchor="middle" font-size="13.5" fill="#B4532A" font-weight="bold">统一元素模型</text>
  <text x="650" y="176" text-anchor="middle" font-size="11.5" fill="#1A1A1E">element_id · type</text>
  <text x="650" y="196" text-anchor="middle" font-size="11.5" fill="#1A1A1E">content · section_path</text>
  <text x="650" y="216" text-anchor="middle" font-size="11.5" fill="#1A1A1E">page · bbox · style</text>
  <text x="650" y="240" text-anchor="middle" font-size="11" fill="#6E6E78">结构来自原始文档</text>
  <text x="650" y="256" text-anchor="middle" font-size="11" fill="#6E6E78">坐标来自渲染文档</text>
  <!-- 连线 -->
  <path d="M140 100 C 190 100, 200 105, 240 108" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <path d="M240 108 l-9 -2 4 8 z" fill="#1A1A1E"/>
  <path d="M140 160 C 190 160, 200 128, 240 122" fill="none" stroke="#1A1A1E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="176" y="150" font-size="10.5" fill="#B4532A">先转 .docx</text>
  <line x1="140" y1="220" x2="240" y2="220" stroke="#1A1A1E" stroke-width="1.5"/>
  <path d="M240 220 l-8 -4 v8 z" fill="#1A1A1E"/>
  <line x1="140" y1="280" x2="240" y2="286" stroke="#1A1A1E" stroke-width="1.5"/>
  <path d="M240 286 l-8 -4 v8 z" fill="#1A1A1E"/>
  <path d="M355 156 C 480 180, 500 190, 560 192" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <path d="M560 192 l-9 -2 4 8 z" fill="#1A1A1E"/>
  <line x1="470" y1="222" x2="560" y2="206" stroke="#1A1A1E" stroke-width="1.5"/>
  <path d="M560 206 l-9 -1 4 7 z" fill="#1A1A1E"/>
  <line x1="470" y1="288" x2="560" y2="238" stroke="#1A1A1E" stroke-width="1.5"/>
  <path d="M560 238 l-9 1 5 -7 z" fill="#1A1A1E"/>
  <!-- 底注 -->
  <text x="380" y="360" text-anchor="middle" font-size="12.5" fill="#6E6E78">OCR 只在没有真源的地方当真源——数字 PDF 的文本层永远优先</text>
</svg>
