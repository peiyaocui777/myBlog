<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <text x="380" y="34" text-anchor="middle" font-size="15" fill="#1A1A1E" font-weight="bold">"串台"的三条竞态路径</text>
  <!-- 泳道 1：双连接 -->
  <rect x="30" y="60" width="700" height="84" rx="6" fill="none" stroke="#E8E5DE" stroke-width="1.5"/>
  <text x="50" y="86" font-size="13.5" fill="#B4532A" font-weight="bold">① 刷新页面</text>
  <rect x="180" y="82" width="150" height="44" rx="4" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="255" y="109" text-anchor="middle" font-size="13" fill="#1A1A1E">同一会话</text>
  <line x1="80" y1="94" x2="180" y2="98" stroke="#1A1A1E" stroke-width="1.5"/>
  <path d="M180 98 l-8 -4 v8 z" fill="#1A1A1E"/>
  <text x="80" y="84" font-size="11.5" fill="#6E6E78">旧连接</text>
  <line x1="80" y1="118" x2="180" y2="114" stroke="#1A1A1E" stroke-width="1.5"/>
  <path d="M180 114 l-8 -4 v8 z" fill="#1A1A1E"/>
  <text x="80" y="136" font-size="11.5" fill="#6E6E78">新连接</text>
  <text x="390" y="96" font-size="12.5" fill="#6E6E78">disconnect 还没跑完，新连接已进来</text>
  <text x="390" y="118" font-size="12.5" fill="#1A1A1E">→ 连接互斥 + 重试窗口 + 僵尸锁接管</text>
  <!-- 泳道 2：抢跑 -->
  <rect x="30" y="156" width="700" height="84" rx="6" fill="none" stroke="#E8E5DE" stroke-width="1.5"/>
  <text x="50" y="182" font-size="13.5" fill="#B4532A" font-weight="bold">② 轮次抢跑</text>
  <rect x="180" y="178" width="90" height="34" rx="4" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="225" y="200" text-anchor="middle" font-size="12.5" fill="#1A1A1E">msg1</text>
  <rect x="310" y="178" width="110" height="34" rx="4" fill="none" stroke="#B4532A" stroke-width="1.5"/>
  <text x="365" y="200" text-anchor="middle" font-size="12.5" fill="#B4532A">AI 处理中…</text>
  <rect x="460" y="178" width="90" height="34" rx="4" fill="none" stroke="#1A1A1E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="505" y="200" text-anchor="middle" font-size="12.5" fill="#6E6E78">msg2 排队</text>
  <text x="590" y="200" font-size="12.5" fill="#1A1A1E">→ 合并成下一轮</text>
  <text x="310" y="230" font-size="12" fill="#6E6E78">两轮并发读写同一份会话状态 → 会话级处理锁</text>
  <!-- 泳道 3：半开 -->
  <rect x="30" y="252" width="700" height="84" rx="6" fill="none" stroke="#E8E5DE" stroke-width="1.5"/>
  <text x="50" y="278" font-size="13.5" fill="#B4532A" font-weight="bold">③ 半开连接</text>
  <rect x="180" y="274" width="110" height="34" rx="4" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="235" y="296" text-anchor="middle" font-size="12.5" fill="#1A1A1E">前端</text>
  <rect x="470" y="274" width="110" height="34" rx="4" fill="none" stroke="#1A1A1E" stroke-width="1.5"/>
  <text x="525" y="296" text-anchor="middle" font-size="12.5" fill="#1A1A1E">服务端</text>
  <line x1="290" y1="288" x2="470" y2="288" stroke="#B4532A" stroke-width="1.5"/>
  <path d="M470 288 l-8 -4 v8 z" fill="#B4532A"/>
  <text x="380" y="280" text-anchor="middle" font-size="12" fill="#B4532A">send() 成功</text>
  <text x="380" y="306" text-anchor="middle" font-size="12" fill="#9B9BA4">× 实际没收到</text>
  <text x="610" y="296" font-size="12.5" fill="#1A1A1E">→ ack + 幂等重发 + 拉历史对齐</text>
</svg>
